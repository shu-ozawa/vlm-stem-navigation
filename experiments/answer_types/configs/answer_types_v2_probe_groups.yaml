# The decision probes of answer_types_v2 again, the views placed by group instead of by offset from the target: the
# target inside the green square, outside it but in view, or not in view (probe.group_views), at the three
# magnifications; 50 specimens each: 50 x 3 groups x 3 magnifications = 450 views per task, 900 per model and reader.
# No episodes. One run per model, on an RTX PRO 6000:
#   for m in gemma4 qwen38_27b muse_glimmer_30b cosmos_reason2_32b magistral_small_2509 nemotron_omni_30b \
#            cosmos_reason2_8b cosmos_reason2_2b gemma4_26b_bf16 gemma4_e2b gemma4_e4b \
#            qwen35_2b qwen35_4b qwen35_9b qwen35_27b cosmos3_super cosmos3_nano; do
#     uv run python experiments/answer_types/run.py --config experiments/answer_types/configs/answer_types_v2_probe_groups.yaml --model $m
#   done
run: answer_types_v2_probe_groups

readers: [typed, generated, generated_thinking]
description: reference
models: [gemma4, qwen38_27b, muse_glimmer_30b,
        cosmos_reason2_32b, magistral_small_2509,
        nemotron_omni_30b,
        cosmos_reason2_8b, cosmos_reason2_2b,
        gemma4_26b_bf16, gemma4_e2b, gemma4_e4b,
        qwen35_2b, qwen35_4b, qwen35_9b, qwen35_27b,
        cosmos3_super, cosmos3_nano]

probes:
  tasks: [grain_boundary, dopant_zoom]
  seeds: {start: 2000, count: 50}
  groups: [inside, outside, not_in_view]
  # inside: uniform in the green square; outside: size uniform from the green square to the FOV edge less the
  # visibility margin; not_in_view: from the FOV edge plus the margin to this many FOVs from the view centre. The
  # margin (TaskRules.visible_margin, the truth's) at zoom index 0, 1, 2: W dopant 1.5, 3.0, 4.5 A; grain boundary
  # 4, 6, 8 A.
  not_in_view_max_fov: 1.0
  zoom_indices: [0, 1, 2]

server: {require_idle_gpu: true, startup_timeout_s: 1500, shutdown_timeout_s: 180}
