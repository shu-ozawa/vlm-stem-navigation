# The target described in other words (src/agent/prompts/texts.yaml targets): answer_types_v2.yaml's episodes with
# only the description changed (the reference: answer_types_v2). Episodes only. One run per model, on an RTX PRO 6000:
#   for m in gemma4 qwen38_27b muse_glimmer_30b cosmos_reason2_32b magistral_small_2509 nemotron_omni_30b \
#            cosmos_reason2_8b cosmos_reason2_2b gemma4_26b_bf16 gemma4_e2b gemma4_e4b \
#            qwen35_2b qwen35_4b qwen35_9b qwen35_27b cosmos3_super cosmos3_nano; do
#     uv run python experiments/answer_types/run.py --config experiments/answer_types/configs/answer_types_v2_descriptions.yaml --model $m
#   done
# Results: results/answer_types_v2_descriptions/episodes/<reader>/<model>/description=<name>/<task>_<start_mode>/
run: answer_types_v2_descriptions

readers: [typed, generated]
models: [gemma4, qwen38_27b, muse_glimmer_30b,
        cosmos_reason2_32b, magistral_small_2509,
        nemotron_omni_30b,
        cosmos_reason2_8b, cosmos_reason2_2b,
        gemma4_26b_bf16, gemma4_e2b, gemma4_e4b,
        qwen35_2b, qwen35_4b, qwen35_9b, qwen35_27b,
        cosmos3_super, cosmos3_nano]

episodes:
  tasks: [dopant_zoom, grain_boundary]
  start_modes: [visible, hidden]
  seeds: {start: 2000, count: 50}
  max_steps: 60
  dose: null
  descriptions: [paraphrased, name_only, visual_only, technical_only, no_description]

server: {require_idle_gpu: true, startup_timeout_s: 1500, shutdown_timeout_s: 180}
